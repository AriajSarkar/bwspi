[package]
name = "bwspi"
version = "0.1.0"
edition = "2021"
authors = ["Ariaj Sarkar <rajsarkar02205@gmail.com>"]
description = "Sarkar Bucket Array (SBA) / Bit-Width Sparse Pointer Index (BWSPI) — a zero-hash, single-instruction routed sparse indexing system for unsorted dynamic data streams"
license = "MIT"
repository = "https://github.com/AriajSarkar/sarkar-bucket-array-sba"
readme = "README.md"
keywords = ["data-structure", "sparse-index", "bit-width", "zero-hash", "simd"]
categories = ["data-structures", "algorithms"]

[dependencies]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
rand = "0.8"
rand_distr = "0.4"
ahash = "0.8"
rustc-hash = "2"
hashbrown = "0.17"

[[bench]]
name = "bwspi_benchmarks"
harness = false

[[bench]]
name = "simd_bench"
harness = false

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
